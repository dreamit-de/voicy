# SwiftLint configuration for Voicy.
# Goal: catch real defects without fighting idiomatic Swift / SwiftUI patterns.

disabled_rules:
  - todo
  - line_length
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - trailing_comma

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - unused_import
  - redundant_nil_coalescing
  - closure_spacing
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - fatal_error_message

included:
  - Voicy
  - Modules
  - Tests

excluded:
  - build
  - .build
  - DerivedData
  - Voicy.xcodeproj

identifier_name:
  min_length: 2
  excluded:
    - id
    - up
    - on
    - at
    - i
    - p
    - pcm
    - vKey
    - log
    - x
    - y

type_name:
  min_length: 3
  excluded:
    - ID

nesting:
  type_level: 3

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
