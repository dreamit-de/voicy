name: Voicy
options:
  bundleIdPrefix: de.dreamit.voicy
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Voicy:
    type: application
    platform: macOS
    sources:
      - path: Voicy
      - path: Modules
    resources:
      - path: Voicy/Resources/Prompts
      - path: Voicy/Resources/Assets.xcassets
    info:
      path: Voicy/Resources/Info.plist
      properties:
        CFBundleName: Voicy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Voicy nutzt das Mikrofon, um deine Sprache lokal in Text umzuwandeln. Die Audiodaten verlassen dein Gerät nicht."
        NSAppleEventsUsageDescription: "Voicy fügt transkribierten Text in das aktive Eingabefeld ein."
        SUFeedURL: "https://dreamit-de.github.io/voicy/appcast.xml"
        SUEnableAutomaticChecks: true
        # EdDSA public key for Sparkle update verification — counterpart of
        # the repo secret SPARKLE_PRIVATE_KEY (rotated 2026-06-11), which
        # internal-release.yml uses to sign update DMGs. Public keys are not
        # secret. Never rotate without a client migration plan: installed
        # apps reject updates signed with a different key.
        SUPublicEDKey: "a/hF7gPPLDjaScuCBzorGg6O9qxWheOU8NbzK/vU0D8="
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dreamit.voicy
        CODE_SIGN_ENTITLEMENTS: Voicy/Resources/Voicy.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WhisperKit
      - package: Sparkle
  VoicyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Voicy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voicy.app/Contents/MacOS/Voicy"
schemes:
  Voicy:
    build:
      targets:
        Voicy: all
        VoicyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VoicyTests
    archive:
      config: Release
