name: Publish Appcast

# Runs after the Release workflow publishes a release.
# Updates appcast.xml on the gh-pages branch so Sparkle can find updates.
#
# Required repository secrets:
#   SPARKLE_PRIVATE_KEY  — EdDSA private key generated by `sparkle generate_keys`
#
# Setup (one-time):
#   1. brew install --cask sparkle          # or download from github.com/sparkle-project/Sparkle/releases
#   2. ./Sparkle.app/Contents/Resources/bin/generate_keys
#      → copy the private key to GitHub Secrets as SPARKLE_PRIVATE_KEY
#      → copy the public key to project.yml → info → properties → SUPublicEDKey
#   3. Enable GitHub Pages: Settings → Pages → Source: Deploy from branch → gh-pages / root

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write

jobs:
  appcast:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION=2.6.4
          curl -sSLf -o /tmp/Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle-tools
          tar -xJf /tmp/Sparkle.tar.xz -C /tmp/sparkle-tools
          echo "/tmp/sparkle-tools/bin" >> "$GITHUB_PATH"

      - name: Download release DMG
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          DMG_URL=$(echo '${{ toJson(github.event.release.assets) }}' \
            | jq -r '.[] | select(.name | endswith(".dmg")) | .browser_download_url' | head -1)
          curl -sSLf -o "Voicy-${VERSION}.dmg" "$DMG_URL"
          echo "DMG_FILE=Voicy-${VERSION}.dmg" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Sign DMG for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key
          SIGNATURE=$(sign_update "$DMG_FILE" -f /tmp/sparkle_private_key | \
            grep -o 'sparkle:edSignature="[^"]*"' | \
            sed 's/sparkle:edSignature="//' | tr -d '"')
          FILE_SIZE=$(stat -f%z "$DMG_FILE")
          echo "SPARKLE_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"
          echo "DMG_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"
          rm /tmp/sparkle_private_key

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          git worktree add gh-pages-dir gh-pages 2>/dev/null || \
            { git checkout --orphan gh-pages && mkdir -p gh-pages-dir && cp -r . gh-pages-dir/ 2>/dev/null || true; }

      - name: Update appcast.xml
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DMG_FILE}"
          PUBDATE=$(date -R)

          mkdir -p gh-pages-dir/voicy

          cat > gh-pages-dir/voicy/appcast.xml << XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Voicy</title>
              <link>https://github.com/${{ github.repository }}</link>
              <description>Voicy update feed</description>
              <language>de</language>
              <item>
                <title>Voicy ${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <enclosure
                  url="${RELEASE_URL}"
                  sparkle:version="${VERSION}"
                  sparkle:shortVersionString="${VERSION}"
                  sparkle:edSignature="${SPARKLE_SIGNATURE}"
                  length="${DMG_SIZE}"
                  type="application/octet-stream"
                />
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              </item>
            </channel>
          </rss>
          XML

      - name: Publish to gh-pages
        run: |
          cd gh-pages-dir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voicy/appcast.xml
          git commit -m "appcast: Voicy v${VERSION}" || echo "Nothing to commit"
          git push origin gh-pages
