name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 0.1.0)'
        required: true
      build_number:
        description: 'Build number (CFBundleVersion, e.g. 1)'
        required: true
        default: '1'

# Required repository secrets:
#   MACOS_CERT_P12_BASE64        — Developer ID Application certificate, .p12 base64-encoded
#   MACOS_CERT_P12_PASSWORD      — password for the .p12
#   MACOS_KEYCHAIN_PASSWORD      — temporary CI keychain password (any value)
#   NOTARY_APPLE_ID              — Apple ID email for notarytool
#   NOTARY_TEAM_ID               — Apple Team ID
#   NOTARY_PASSWORD              — app-specific password for the Apple ID

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project Voicy.xcodeproj \
            -scheme Voicy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Voicy.xcarchive \
            MARKETING_VERSION=${{ inputs.version }} \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number }} \
            archive

      - name: Export Developer ID build
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/Voicy.xcarchive \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath build/Voicy

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Voicy ${{ inputs.version }}" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "build/Voicy-${{ inputs.version }}.dmg" \
            "build/Voicy/Voicy.app"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit \
            "build/Voicy-${{ inputs.version }}.dmg" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "build/Voicy-${{ inputs.version }}.dmg"

      - name: Verify Gatekeeper acceptance
        run: |
          xcrun stapler validate "build/Voicy-${{ inputs.version }}.dmg"
          spctl --assess --type install --verbose "build/Voicy-${{ inputs.version }}.dmg" || true

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Voicy v${{ inputs.version }}
          draft: true
          files: build/Voicy-${{ inputs.version }}.dmg
          generate_release_notes: true
