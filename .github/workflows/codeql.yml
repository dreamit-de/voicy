name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen 2>&1 | tee logs-install.txt

      - name: Generate project
        run: xcodegen generate 2>&1 | tee logs-xcodegen.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-and-quality

      - name: Build for CodeQL
        run: |
          set -o pipefail
          xcodebuild \
            -project Voicy.xcodeproj \
            -scheme Voicy \
            -configuration Debug \
            -destination 'platform=macOS,name=Any Mac' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build 2>&1 | tee logs-build.txt

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"

      - name: Upload CodeQL logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeQLLogs
          path: logs-*.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Post failure log to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## CodeQL (Swift) failure"
            echo
            echo "Errors/warnings extracted per step. Full logs are in the **CodeQLLogs** artifact."
            for f in logs-install.txt logs-xcodegen.txt logs-build.txt; do
              if [ -f "$f" ]; then
                echo
                echo "<details><summary><code>$f</code> — errors & warnings</summary>"
                echo
                echo '```'
                grep -E "error:|warning:|FAILED|fatal error|note:|cannot find|undefined symbol|Linker command failed|CodeQL" "$f" \
                  | grep -v "swift-frontend " \
                  | head -n 60 | head -c 20000 \
                  || echo "(no error/warning lines matched in $f)"
                echo '```'
                echo
                echo '<details><summary>Last 30 lines of raw log</summary>'
                echo
                echo '```'
                tail -n 30 "$f" | head -c 8000
                echo '```'
                echo '</details>'
                echo "</details>"
              fi
            done
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file comment.md
