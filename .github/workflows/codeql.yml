name: CodeQL

# CodeQL on macos-14 with the full WhisperKit build takes 25–35 minutes
# per invocation. To keep GitHub Actions minutes spend under control we
# keep this workflow off the PR/push hot path and rely on the weekly cron
# plus manual dispatch for coverage. Re-add `pull_request: { branches: [main] }`
# once GHAS is enabled and PR-time findings are genuinely actionable.
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-14
    timeout-minutes: 60
    # CodeQL on org-owned repos uploads SARIF results to the GitHub Security tab,
    # which requires GitHub Advanced Security (GHAS). Until GHAS is enabled on
    # dreamit-de/voicy, the upload step fails the job, so we mark this check
    # non-blocking and store findings as an artifact instead. Flip
    # continue-on-error to false (and set `upload: always` below) once GHAS is
    # turned on in repo Settings → Security → Code security and analysis.
    continue-on-error: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Install xcodegen
        run: brew install xcodegen 2>&1 | tee logs-install.txt

      - name: Generate project
        run: xcodegen generate 2>&1 | tee logs-xcodegen.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          queries: security-and-quality

      - name: Build for CodeQL
        run: |
          set -o pipefail
          xcodebuild \
            -project Voicy.xcodeproj \
            -scheme Voicy \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build 2>&1 | tee logs-build.txt

      - name: Perform CodeQL analysis
        id: codeql_analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
          # Don't push SARIF to the Security tab — that requires GitHub Advanced
          # Security on org repos. Findings land in the SarifResults artifact.
          upload: never
          output: codeql-results

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarifResults
          path: codeql-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload CodeQL logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeQLLogs
          path: logs-*.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Post failure log to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## CodeQL (Swift) failure"
            echo
            echo "Errors/warnings extracted per step. Full logs are in the **CodeQLLogs** artifact."
            for f in logs-install.txt logs-xcodegen.txt logs-build.txt; do
              if [ -f "$f" ]; then
                echo
                echo "<details><summary><code>$f</code> — errors & warnings</summary>"
                echo
                echo '```'
                grep -E "error:|warning:|FAILED|fatal error|note:|cannot find|undefined symbol|Linker command failed|CodeQL" "$f" \
                  | grep -v "swift-frontend " \
                  | head -n 60 | head -c 20000 \
                  || echo "(no error/warning lines matched in $f)"
                echo '```'
                echo
                echo '<details><summary>Last 30 lines of raw log</summary>'
                echo
                echo '```'
                tail -n 30 "$f" | head -c 8000
                echo '```'
                echo '</details>'
                echo "</details>"
              fi
            done
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file comment.md
